services:
  database:
    image: postgres:16-alpine
    container_name: grupo-nobre-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grupo_nobre_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grupo_nobre_crm']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
