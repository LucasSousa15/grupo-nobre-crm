services:
  database-test:
    image: postgres:16-alpine
    container_name: grupo-nobre-crm-postgres-test
    environment:
      POSTGRES_DB: grupo_nobre_crm_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grupo_nobre_crm_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_test_data:
